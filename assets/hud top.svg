<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" role="img" aria-label="Netrunner contribution feed header" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="shape"><path d="M0 0H868L900 26V60H32L0 34Z"/></clipPath>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#fcee0a" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <style>
    .t { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-weight: 700; font-size: 20px; letter-spacing: 1px; }
    .s { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 10px; letter-spacing: 1px; }
  </style>

  <g clip-path="url(#shape)">
    <rect width="900" height="60" fill="#07070a"/>
    <rect x="640" width="260" height="60" fill="url(#stripes)"/>
    <rect width="12" height="60" fill="#fcee0a"/>

    <!-- scan line -->
    <rect x="0" y="-6" width="900" height="6" fill="#00f0ff" fill-opacity="0.18">
      <animate attributeName="y" from="-6" to="60" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- glitch title: pink + cyan ghosts jitter, yellow stays -->
    <text class="t" x="30" y="38" fill="#ff003c" opacity="0.85">BREACH_PROTOCOL // CONTRIBUTION_FEED
      <animate attributeName="x" values="30;30;26;34;30;30" keyTimes="0;0.88;0.9;0.93;0.96;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
    </text>
    <text class="t" x="30" y="38" fill="#00f0ff" opacity="0.85">BREACH_PROTOCOL // CONTRIBUTION_FEED
      <animate attributeName="x" values="30;30;34;26;30;30" keyTimes="0;0.88;0.9;0.93;0.96;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
    </text>
    <text class="t" x="30" y="38" fill="#fcee0a">BREACH_PROTOCOL // CONTRIBUTION_FEED</text>

    <!-- right side readouts -->
    <text class="s" x="866" y="24" text-anchor="end" fill="#00f0ff">SYS.NET_WATCH // NODE: NIXON_IVERSON</text>
    <circle cx="640" cy="45" r="4" fill="#ff003c">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text class="s" x="650" y="49" fill="#ff003c">LIVE FEED</text>
  </g>

  <path d="M0.5 0.5H867.6L899.5 26.4V59.5H32.4L0.5 33.6Z" fill="none" stroke="#fcee0a" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
