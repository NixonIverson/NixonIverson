<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Animated banner: terminal typing intro and orbiting tech stack" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08000f"/>
      <stop offset="0.55" stop-color="#150028"/>
      <stop offset="1" stop-color="#2d0a4e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd6e7"/>
      <stop offset="0.45" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="term"><rect x="30" y="30" width="430" height="240" rx="12"/></clipPath>
    <clipPath id="card"><rect x="0" y="0" width="900" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 14px; }
    .cmd { fill: #f9f002; }
    .out { fill: #05d9e8; }
    .lbl { font-family: Consolas, 'Courier New', monospace; font-weight: 700; fill: #08000f; }

    .cv { fill: #07000f; }
    .c1 { animation: k1 14s infinite; }
    .c2 { animation: k2 14s infinite; }
    .c3 { animation: k3 14s infinite; }
    .c4 { animation: k4 14s infinite; }
    .c5 { animation: k5 14s infinite; }
    .c6 { animation: k6 14s infinite; }

    @keyframes k1 { 0%,3%{transform:translateX(0);animation-timing-function:steps(8)} 9%,92%{transform:translateX(71px)} 93%,100%{transform:translateX(0)} }
    @keyframes k2 { 0%,11%{transform:translateX(0);animation-timing-function:steps(15)} 18%,92%{transform:translateX(130px)} 93%,100%{transform:translateX(0)} }
    @keyframes k3 { 0%,22%{transform:translateX(0);animation-timing-function:steps(16)} 28%,92%{transform:translateX(138px)} 93%,100%{transform:translateX(0)} }
    @keyframes k4 { 0%,30%{transform:translateX(0);animation-timing-function:steps(37)} 42%,92%{transform:translateX(315px)} 93%,100%{transform:translateX(0)} }
    @keyframes k5 { 0%,46%{transform:translateX(0);animation-timing-function:steps(14)} 52%,92%{transform:translateX(122px)} 93%,100%{transform:translateX(0)} }
    @keyframes k6 { 0%,54%{transform:translateX(0);animation-timing-function:steps(33)} 66%,92%{transform:translateX(281px)} 93%,100%{transform:translateX(0)} }

    .cursor { animation: blink 14s infinite; }
    @keyframes blink {
      0%,65%{opacity:0} 66%{opacity:1} 70%{opacity:0} 74%{opacity:1} 78%{opacity:0}
      82%{opacity:1} 86%{opacity:0} 90%{opacity:1} 92%{opacity:1} 93%,100%{opacity:0}
    }
  </style>

  <g clip-path="url(#card)">
    <!-- Background -->
    <rect width="900" height="300" fill="url(#bg)"/>

    <!-- Subtle grid -->
    <g stroke="#05d9e8" stroke-opacity="0.06">
      <path d="M0 50H900M0 100H900M0 150H900M0 200H900M0 250H900"/>
      <path d="M50 0V300M100 0V300M150 0V300M200 0V300M250 0V300M300 0V300M350 0V300M400 0V300M450 0V300M500 0V300M550 0V300M600 0V300M650 0V300M700 0V300M750 0V300M800 0V300M850 0V300"/>
    </g>

    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="490" cy="40" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="250" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="80" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="270" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="25" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="90" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="200" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="275" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="160" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="140" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="475" cy="205" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ============ Terminal window ============ -->
    <rect x="30" y="30" width="430" height="240" rx="12" fill="#07000f" stroke="#05d9e8" stroke-opacity="0.8"/>
    <rect x="30" y="30" width="430" height="34" rx="12" fill="#1a0030"/>
    <rect x="30" y="50" width="430" height="14" fill="#1a0030"/>
    <circle cx="52" cy="47" r="6" fill="#ff2a6d"/>
    <circle cx="72" cy="47" r="6" fill="#f9f002"/>
    <circle cx="92" cy="47" r="6" fill="#05d9e8"/>
    <text x="245" y="51" text-anchor="middle" class="mono" style="font-size:12px" fill="#b48cff">nixon@portfolio: ~</text>

    <g clip-path="url(#term)">
      <!-- line 1 -->
      <text x="52" y="100" class="mono cmd" textLength="67.2" lengthAdjust="spacing">$ whoami</text>
      <rect class="cv c1" x="50" y="84" width="73" height="22"/>
      <!-- line 2 -->
      <text x="52" y="124" class="mono out" textLength="126" lengthAdjust="spacing">&gt; Nixon Iverson</text>
      <rect class="cv c2" x="50" y="108" width="132" height="22"/>
      <!-- line 3 -->
      <text x="52" y="160" class="mono cmd" textLength="134.4" lengthAdjust="spacing">$ cat skills.txt</text>
      <rect class="cv c3" x="50" y="144" width="140" height="22"/>
      <!-- line 4 -->
      <text x="52" y="184" class="mono out" textLength="310.8" lengthAdjust="spacing">&gt; PHP &#183; MySQL &#183; JS &#183; Python &#183; Arduino</text>
      <rect class="cv c4" x="50" y="168" width="317" height="22"/>
      <!-- line 5 -->
      <text x="52" y="220" class="mono cmd" textLength="117.6" lengthAdjust="spacing">$ status --now</text>
      <rect class="cv c5" x="50" y="204" width="124" height="22"/>
      <!-- line 6 -->
      <text x="52" y="244" class="mono out" textLength="277.2" lengthAdjust="spacing">&gt; building clean, light websites</text>
      <rect class="cv c6" x="50" y="228" width="283" height="22"/>
      <!-- cursor -->
      <rect class="cursor" x="334" y="231" width="8" height="16" fill="#ff2a6d"/>
    </g>

    <!-- ============ Orbit system ============ -->
    <circle cx="700" cy="150" r="140" fill="url(#glow)"/>
    <g fill="none" stroke="#05d9e8" stroke-opacity="0.45" stroke-dasharray="3 7">
      <circle cx="700" cy="150" r="62"/>
      <circle cx="700" cy="150" r="98"/>
      <circle cx="700" cy="150" r="134"/>
    </g>

    <!-- core -->
    <circle cx="700" cy="150" r="28" fill="url(#core)">
      <animate attributeName="r" values="27;31;27" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="700" y="156" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#ffffff">NI</text>

    <!-- PHP (inner orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 700 150" to="360 700 150" dur="9s" repeatCount="indefinite"/>
      <circle cx="762" cy="150" r="16" fill="#05d9e8"/>
      <text x="762" y="154" text-anchor="middle" class="lbl" font-size="10">PHP
        <animateTransform attributeName="transform" type="rotate" from="0 762 150" to="-360 762 150" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- JS (middle orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 700 150" to="360 700 150" dur="14s" repeatCount="indefinite"/>
      <circle cx="798" cy="150" r="16" fill="#f9f002"/>
      <text x="798" y="154" text-anchor="middle" class="lbl" font-size="11">JS
        <animateTransform attributeName="transform" type="rotate" from="0 798 150" to="-360 798 150" dur="14s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- PY (middle orbit, opposite side) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 700 150" to="540 700 150" dur="14s" repeatCount="indefinite"/>
      <circle cx="798" cy="150" r="16" fill="#ff2a6d"/>
      <text x="798" y="154" text-anchor="middle" class="lbl" font-size="11" style="fill:#ffffff">PY
        <animateTransform attributeName="transform" type="rotate" from="-180 798 150" to="-540 798 150" dur="14s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- UI (outer orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="90 700 150" to="450 700 150" dur="20s" repeatCount="indefinite"/>
      <circle cx="834" cy="150" r="16" fill="#7b2ff7"/>
      <text x="834" y="154" text-anchor="middle" class="lbl" font-size="11" style="fill:#ffffff">UI
        <animateTransform attributeName="transform" type="rotate" from="-90 834 150" to="-450 834 150" dur="20s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Arduino (outer orbit, opposite side) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="270 700 150" to="630 700 150" dur="20s" repeatCount="indefinite"/>
      <circle cx="834" cy="150" r="16" fill="#39ff14"/>
      <text x="834" y="153" text-anchor="middle" class="lbl" font-size="8" style="fill:#08000f">ARD
        <animateTransform attributeName="transform" type="rotate" from="-270 834 150" to="-630 834 150" dur="20s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#7b2ff7" stroke-opacity="0.8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
