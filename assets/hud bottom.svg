<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="Netrunner status bar" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="shape"><path d="M0 0H868L900 10V44H32L0 34Z"/></clipPath>
    <clipPath id="hexwin"><rect x="300" y="8" width="360" height="28"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcee0a"/>
      <stop offset="1" stop-color="#ff003c"/>
    </linearGradient>
  </defs>
  <style>
    .s { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; }
  </style>

  <g clip-path="url(#shape)">
    <rect width="900" height="44" fill="#07070a"/>
    <rect x="888" width="12" height="44" fill="#fcee0a"/>

    <!-- progress bar -->
    <text class="s" x="22" y="18" fill="#fcee0a">UPLOADING COMMITS</text>
    <rect x="22" y="25" width="230" height="8" fill="#14141a" stroke="#00f0ff" stroke-opacity="0.7"/>
    <rect x="23" y="26" width="0" height="6" fill="url(#bar)">
      <animate attributeName="width" values="0;228;228;0" keyTimes="0;0.7;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- scrolling hex stream -->
    <g clip-path="url(#hexwin)">
      <g class="s" fill="#00f0ff" fill-opacity="0.75">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-501.6 0" dur="14s" repeatCount="indefinite"/>
        <text x="300" y="26" textLength="501.6" lengthAdjust="spacing" xml:space="preserve">0x4E49 0x58 0x4F 0x4E // 0xC0DE 0xF00D // 0xBEEF 0x2077 // 0xFACE 0x1337 // </text>
        <text x="801.6" y="26" textLength="501.6" lengthAdjust="spacing" xml:space="preserve">0x4E49 0x58 0x4F 0x4E // 0xC0DE 0xF00D // 0xBEEF 0x2077 // 0xFACE 0x1337 // </text>
        <text x="1303.2" y="26" textLength="501.6" lengthAdjust="spacing" xml:space="preserve">0x4E49 0x58 0x4F 0x4E // 0xC0DE 0xF00D // 0xBEEF 0x2077 // 0xFACE 0x1337 // </text>
      </g>
    </g>

    <!-- status -->
    <text class="s" x="866" y="27" text-anchor="end" fill="#fcee0a">ACCESS GRANTED
      <animate attributeName="opacity" values="1;1;0.25;1;1" keyTimes="0;0.6;0.65;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <path d="M0.5 0.5H867.6L899.5 10.4V43.5H32.4L0.5 33.6Z" fill="none" stroke="#fcee0a" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
