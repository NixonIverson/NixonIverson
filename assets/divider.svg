<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="Animated divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05d9e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#05d9e8"/>
      <stop offset="1" stop-color="#05d9e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2a6d" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="11" width="900" height="2" rx="1" fill="#3a1a5c" fill-opacity="0.9"/>
  <rect x="-300" y="10.5" width="300" height="3" rx="1.5" fill="url(#g1)">
    <animate attributeName="x" from="-300" to="900" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="-300" y="10.5" width="300" height="3" rx="1.5" fill="url(#g2)">
    <animate attributeName="x" from="-300" to="900" dur="4s" begin="-2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="450" cy="12" r="12" fill="url(#halo)">
    <animate attributeName="r" values="8;13;8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="446" y="8" width="8" height="8" fill="#08000f" stroke="#05d9e8" stroke-width="1.5" transform="rotate(45 450 12)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
